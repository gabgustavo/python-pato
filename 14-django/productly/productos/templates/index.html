{% extends 'base.html' %}

{% block content %}
<h1>Productos 
    <a type="button" href="formulario" class="btn btn-outline-primary">Nuevo</a>
</h1>


<table class="table table-striped table-hover">
    <thead>
        <tr>
            <td>Nombre</td>
            <td>Stock</td>
            <td>Puntaje</td>
            <td>Categoría</td>
        </tr>
    </thead>
    <tbody>
        {% for producto in productos %}
        <tr>
            <td>
                <a href="{% url 'producto:detalle' producto.id %}">
                    {{ producto.nombre }}
                </a>
            </td>
            <td>{{ producto.stock }}</td>
            <td>{{ producto.puntaje }}</td>
            <td>{{ producto.categoria }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
