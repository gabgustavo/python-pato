{% extends 'base.html' %}

{% block content %}
<h1>Productos</h1>
<table class="table table-striped table-hover">
    <thead>
        <tr>
            <td>Nombre</td>
            <td>Stock</td>
            <td>Puntaje</td>
            <td>Categoría</td>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td><a href="productos/{{ producto.id }}">{{ producto.nombre }}</a></td>
            <td>{{ producto.stock }}</td>
            <td>{{ producto.puntaje }}</td>
            <td>{{ producto.categoria }}</td>
        </tr>
    </tbody>
</table>
{% endblock %}
